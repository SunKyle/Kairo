name: CI

# 只在 main 与 PR 上跑。这个项目没有测试的那些年,回归全靠手测;
# 现在至少把「类型 + 单测 + 能构建」这三件机器能判的事交给机器。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ci 而不是 install:锁文件必须与 package.json 一致,不一致就当场失败 ——
      # 这正是我们想要的信号,而不是悄悄装一份不一样的依赖树
      - run: npm ci

      # 三步分开跑而不是串成一条 build:哪一步红的要一眼看得出来
      - name: Typecheck
        run: npm run typecheck

      # 与上一步不同的一道:tsconfig 的 include 只有 src/**,server/** 平时
      # **不过任何类型检查**,而 node --check 只查语法。于是"拆模块时漏了一个
      # import"两条路都看不见 —— 它只在真的打到那个端点时让整个 Node 进程退出
      # (2026-10-06:tts.js 少了 normalizeResourceId 的定义,一次语音请求就把
      # 后端打死,前端只看到 500)。这一步专盯"用到的名字有没有出处"。
      - name: Server module wiring (undefined names)
        run: npm run check:server

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

      # 对话出图那条链的端到端探针:假上游(SSE) + 真的 KImage 服务端,
      # 把 /api/chat → 剪标签 → /api/enhance(photo 档) → /api/generate 跑一遍。
      # 放在这个 job 里而不是 perf:它不需要浏览器、不量性能,判的是"接缝对不对"
      # —— 扣尾有没有漏半截标签、photo 档有没有被塞进 REF_NOTE、载荷里的
      # size/quality 对不对。不花钱、不联网(上游是本地假服务)。
      - name: Chat photo pipeline probe (end-to-end, fake upstream)
        run: npm run probe:chat-photo

      # 上面那条验的是"某一条路的业务对不对",这两步验的是另一件事:
      # **每个端点打一遍之后,进程还活着吗**。模块化之后,一个漏掉的 import
      # 不是"坏一条路",是整台服务没了 —— 而那时所有端点都只回 ECONNREFUSED,
      # 从单个请求的返回码上根本看不出是这个原因。
      # 与 perf job 同一个手法:后台起服务,下一步用它。
      - name: Serve the API
        run: |
          npm run dev:server &
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3000/api/health && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3000/api/health || { echo "后端没起来"; exit 1; }

      # 请求一律不碰真上游(目标写成丢弃端口 127.0.0.1:9),断言的是
      # "拿到了响应" + "进程仍然健康",所以不花钱、不联网。
      - name: API smoke (every endpoint + the process survives)
        run: npm run smoke:api

  # 性能与跨标签页同步的回归门。
  # 与上面那个 job 分开:上面判"对不对"(秒级),这里判"有没有变慢/变胖"(分钟级),
  # 两者红的意义完全不同,混在一个 job 里会让"哪一类坏了"看不出来。
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npx vite build

      # GitHub 的 ubuntu runner 自带 Chrome。脚本自己会找它(--no-sandbox 已经带上,
      # 那只在受限环境里才是必需的)
      - name: Serve the built app
        run: |
          npx vite preview --port 4173 --strictPort &
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            sleep 0.5
          done
          curl -sf -o /dev/null http://localhost:4173/ || { echo "预览服务没起来"; exit 1; }

      # 预算只钉"结构性"的那两项:DOM 节点数与铺完耗时。
      # 节点数是结构与数据规模决定的,跑在什么机器上都一样,所以它卡得紧
      # (实测 3,016,阈值 6,000 留一倍余量);
      # 耗时随 runner 快慢浮动,阈值给得很松,只拦"塌方式"的回归。
      # JS 堆不钉:它在不同机器上差得多,钉了只会反复误报。
      - name: Perf budgets + probes (cross-tab / config / canvas / history / chars / chat / params / gen)
        run: |
          node scripts/measure-history.mjs \
            --url http://localhost:4173/ \
            --records 500 --images 2 --settle-ms 1500 \
            --probe-two-tabs --probe-config --probe-canvas --probe-history --probe-chars --probe-chat --probe-params --probe-gen \
            --max-dom-nodes 6000 --max-ms 5000
