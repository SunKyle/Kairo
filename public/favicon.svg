<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    站点图标:墨色画框里的 K。
    K 按品牌字标(Poppins 几何粗体)的比例手绘 —— 等粗 4.6、端点垂直切平、
    主干与两笔并成实心,字身 15.2×19.2 光学居中,四周留 6.4 的呼吸。
    内框是一根压暗的发丝线,取「装裱一幅画」的意思:画廊的本行。
    它刻意比 K 淡(45% 而不是纯白),否则框和字一样响,标记就没有主次了。
    深色标签页里整体反相,墨块变纸色,避免黑色图标糊在深色底上看不见。
    属性值即浅色方案,浏览器不支持内嵌样式时也不会渲染成空白。
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f5f5f5; }
      .ink { fill: #111111; }
      .frame { stroke: rgba(17, 17, 17, 0.45); }
    }
  </style>

  <rect class="tile" x="0" y="0" width="32" height="32" rx="8" fill="#111111" />

  <!-- 主干 / 上笔 / 下笔。分三条路径而不是合并:重叠处按 nonzero 会互相抵消挖出空洞 -->
  <g class="ink" fill="#ffffff">
    <path d="M8.4 6.4H13V25.6H8.4Z" />
    <path d="M10.784 14.188 20.75 6.4 23.582 10.025 13.616 17.812Z" />
    <path d="M13.616 14.188 23.582 21.975 20.75 25.6 10.784 17.812Z" />
  </g>

  <rect
    class="frame"
    x="2.6"
    y="2.6"
    width="26.8"
    height="26.8"
    rx="5.6"
    fill="none"
    stroke="rgba(255, 255, 255, 0.45)"
    stroke-width="1.6"
  />
</svg>